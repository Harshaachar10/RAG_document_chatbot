<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Doctor Intelligence Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy sidebar + light analytics workspace (Affine Analytics app look). Single light theme by design. */
:root {
  --nav: #0f2340; --nav-2: #17304f; --nav-active: #24456f; --nav-text: #c3cfdf; --nav-muted: #7f93ad;
  --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f8fafc; --line: #e2e8f0; --line-2: #cfd8e3;
  --fg: #0f1b2d; --muted: #5a6b80; --faint: #8b9aad;
  --accent: #1e5aa8; --accent-hover: #174a8c; --accent-soft: #e8f0fb; --accent-line: #b9cfee;
  --ok: #0d8065; --ok-bg: #e2f4ee; --warn: #a86400; --warn-bg: #fff2d9; --bad: #bf3329; --bad-bg: #fde8e6;
  --new: #5b45c2; --new-bg: #eeebfb; --neu: #5f6f82; --neu-bg: #edf1f5;
  --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 10px; --shadow: 0 1px 2px rgba(15,27,45,.06), 0 4px 16px rgba(15,27,45,.05);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.num { font-variant-numeric: tabular-nums; }

/* shell */
.app { display: grid; grid-template-columns: 244px 1fr; min-height: 100%; }
.side { background: var(--nav); color: var(--nav-text); display: flex; flex-direction: column; gap: 20px; padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 700; font-size: 15px; padding: 0 6px; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #3b82d6, #1e5aa8); display: grid; place-items: center; font-size: 13px; color: #fff; }
.prod { padding: 0 6px; display: grid; gap: 6px; }
.prod b { color: #fff; font-size: 14px; font-weight: 600; }
.tag-syn { justify-self: start; font-size: 11px; background: var(--nav-2); color: var(--nav-text); border: 1px solid #2b4566; border-radius: 6px; padding: 2px 8px; }
.nav { display: grid; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 10px; color: var(--nav-text); text-decoration: none; padding: 9px 10px; border-radius: 8px; font-weight: 500; }
.nav a:hover { background: var(--nav-2); color: #fff; }
.nav a.on { background: var(--nav-active); color: #fff; box-shadow: inset 3px 0 0 #5c9be6; }
.nav a svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; background: #c2410c; color: #fff; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 7px; }
.sysstat { margin-top: auto; border-top: 1px solid #22395a; padding: 14px 6px 0; display: grid; gap: 6px; font-size: 12px; }
.sysstat b { color: #fff; font-size: 12px; font-weight: 600; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #34c38f; margin-right: 7px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(244,246,250,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
  padding-block: 14px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.top .sub { font-size: 12.5px; color: var(--muted); }
.top .spacer { flex: 1; }
.gsearch { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 220px; }
.gsearch input { border: 0; outline: 0; background: none; width: 100%; }
.gsearch svg { width: 16px; height: 16px; color: var(--faint); flex: none; }
.view { padding-block: 22px 60px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; min-width: 0; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 8px 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link { color: var(--accent); background: none; border: 0; padding: 0; text-decoration: none; font-weight: 500; }
.link:hover { text-decoration: underline; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: baseline; gap: 10px; padding: 16px 18px 0; flex-wrap: wrap; }
.card-h h2, .card-h h3 { margin: 0; font-size: 15px; font-weight: 600; }
.card-h .hint { font-size: 12.5px; color: var(--muted); }
.card-h .right { margin-left: auto; }
.card-b { padding: 14px 18px 18px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.kpis { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.kpi { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 6px; box-shadow: var(--shadow); position: relative; transition: border-color .15s, transform .15s; }
.kpi:hover { border-color: var(--accent-line); transform: translateY(-1px); }
.kpi .lbl { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.kpi .val { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .val small { font-size: 15px; font-weight: 500; color: var(--muted); }
.kpi .sub { font-size: 12.5px; color: var(--muted); }
.kpi .delta { position: absolute; top: 14px; right: 14px; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 8px; background: var(--ok-bg); color: var(--ok); animation: pop .4s ease; }
.kpi .delta.down { background: var(--accent-soft); color: var(--accent); }
.kpi .bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.kpi .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .9s ease; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; border: 1px solid transparent; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.new { background: var(--new-bg); color: var(--new); }
.pill.neu { background: var(--neu-bg); color: var(--neu); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.outline { background: transparent; border-color: var(--line-2); color: var(--muted); font-weight: 500; }
.newdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--new); margin-left: 6px; box-shadow: 0 0 0 0 rgba(91,69,194,.5); animation: pulse 1.8s infinite; vertical-align: middle; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(91,69,194,.45); } 70% { box-shadow: 0 0 0 7px rgba(91,69,194,0); } 100% { box-shadow: 0 0 0 0 rgba(91,69,194,0); } }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #f5f8fd; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.cellbtn { background: none; border: 0; padding: 2px 6px; border-radius: 6px; font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
.cellbtn:hover { background: var(--accent-soft); }
.cellbtn.zero { color: var(--faint); font-weight: 400; pointer-events: none; }

/* flow strip */
.flow { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 4px 2px 8px; }
.flow .step { flex: 1 0 140px; text-align: left; background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 2px; position: relative; }
.flow .step:first-child { border-radius: 10px 0 0 10px; }
.flow .step:last-child { border-radius: 0 10px 10px 0; }
.flow .step + .step { border-left: 0; }
.flow .step:hover { background: var(--accent-soft); }
.flow .step b { font-size: 22px; font-variant-numeric: tabular-nums; }
.flow .step span { font-size: 12.5px; color: var(--muted); }
.flow .step i { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }

/* impact tiles */
.impact { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.tile { text-align: left; border: 1px solid var(--line); border-radius: var(--r); padding: 16px; background: var(--surface-2); display: grid; gap: 6px; }
.tile:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.tile b { font-size: 24px; letter-spacing: -.01em; }
.tile p { margin: 0; color: var(--muted); font-size: 13px; }
.tile .k { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }

/* lists */
.list { display: grid; }
.li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; }
.li:last-child { border-bottom: 0; }
button.li:hover { background: #f7f9fd; }
.li .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.li .ic svg { width: 16px; height: 16px; }
.li .tx { display: grid; gap: 2px; min-width: 0; flex: 1; }
.li .tx b { font-weight: 600; }
.li .tx span { color: var(--muted); font-size: 13px; }
.ic.ok { background: var(--ok-bg); color: var(--ok); } .ic.warn { background: var(--warn-bg); color: var(--warn); } .ic.bad { background: var(--bad-bg); color: var(--bad); } .ic.acc { background: var(--accent-soft); color: var(--accent); } .ic.new { background: var(--new-bg); color: var(--new); } .ic.neu { background: var(--neu-bg); color: var(--neu); }

.qbar { display: grid; grid-template-columns: 110px 1fr 46px; align-items: center; gap: 10px; padding: 7px 0; }
.qbar .track { height: 8px; background: var(--line); border-radius: 4px; position: relative; overflow: hidden; }
.qbar .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; transition: width .9s ease; }
.qbar .track i.present { background: var(--accent-line); }
.qbar .track i.valid { background: var(--accent); }

/* source cards (before run) */
.srcs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.src { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px 16px; display: grid; gap: 6px; }
.src b { font-size: 14px; }
.src .rows { font-size: 22px; font-weight: 700; }
.hero { display: grid; gap: 18px; grid-template-columns: 1fr auto; align-items: center; padding: 22px 24px; background: linear-gradient(120deg, #0f2340 0%, #1e5aa8 100%); color: #fff; border-radius: 14px; }
.hero h2 { margin: 0 0 6px; font-size: 22px; }
.hero p { margin: 0; color: #d4e2f5; max-width: 60ch; }
.hero .btn.primary { background: #fff; color: var(--accent); border-color: #fff; font-weight: 600; }

/* chips / tabs */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip .c { font-weight: 600; margin-left: 4px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 14px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.tab:hover { color: var(--fg); }

/* doctor profile */
.dhead { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 20px; }
.avatar { width: 56px; height: 56px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 19px; }
.dhead h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.dmeta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.ai { border: 1px solid var(--accent-line); background: linear-gradient(180deg, #f3f7fd, #fff); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; }
.ai-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.ai-h b { color: var(--accent); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
.ai p { margin: 0; font-size: 14.5px; line-height: 1.65; max-width: 95ch; }
.cite { font-family: var(--mono); font-size: 11.5px; background: var(--surface); border: 1px solid var(--accent-line); color: var(--accent); border-radius: 5px; padding: 0 5px; margin: 0 1px; }
.cite:hover { background: var(--accent-soft); }
.pending-note { font-size: 13px; color: var(--warn); }

.fieldrow td:first-child { color: var(--muted); width: 170px; }
.missing { color: var(--bad); font-weight: 500; }

.timeline { display: grid; gap: 0; position: relative; padding-left: 4px; }
.tl { display: grid; grid-template-columns: 96px 28px 1fr; gap: 10px; align-items: start; text-align: left; background: none; border: 0; padding: 0; width: 100%; }
.tl .d { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 12px; text-align: right; }
.tl .rail { position: relative; height: 100%; display: grid; justify-items: center; }
.tl .rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl .node { position: relative; margin-top: 10px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--surface); }
.tl .node svg { width: 12px; height: 12px; }
.tl .body { margin: 4px 0 8px; padding: 9px 12px; border-radius: 9px; border: 1px solid transparent; display: grid; gap: 2px; }
.tl:hover .body { background: #f6f9fd; border-color: var(--line); }
.tl .body b { font-weight: 600; }
.tl .body span { font-size: 13px; color: var(--muted); }
.tl.pending .body { border: 1px dashed var(--warn); background: #fffaf0; }
.tl.isnew .body { border-color: var(--new); background: #f7f5ff; animation: glow 2s ease 2; }
@keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(91,69,194,.15); } }

.lineage { overflow-x: auto; }
.lineage svg { display: block; min-width: 820px; width: 100%; height: auto; }
.lineage .nd rect { fill: var(--surface); stroke: var(--line-2); }
.lineage .nd:hover rect { stroke: var(--accent); fill: var(--accent-soft); }
.lineage .nd text { font-family: var(--font); font-size: 12px; fill: var(--fg); }
.lineage .nd text.s { fill: var(--muted); font-size: 11px; }
.lineage .nd.src rect { fill: #eef3fb; }
.lineage .nd.dec rect { fill: var(--surface-2); }
.lineage .nd.gold rect { fill: var(--accent-soft); stroke: var(--accent); }
.lineage .nd.isnew rect { stroke: var(--new); stroke-width: 2; }
.lineage .nd.pend rect { stroke: var(--warn); stroke-dasharray: 4 3; }
.lineage path.e { fill: none; stroke: var(--line-2); stroke-width: 1.4; }
.lineage path.e.new { stroke: var(--new); }
.lineage path.e.pend { stroke: var(--warn); stroke-dasharray: 4 3; }
.lineage .nd { cursor: pointer; }

.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(150px, 260px) 1fr 40px; gap: 12px; align-items: center; }
.bar-row .b { height: 22px; border-radius: 5px; background: var(--accent); transition: width .8s ease; }
.bar-row .b.alt { background: var(--warn); }
.bar-row .b.after { background: var(--ok); }

/* review */
.rv { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
.queue { position: sticky; top: 76px; max-height: calc(100vh - 96px); display: flex; flex-direction: column; }
.queue .qlist { overflow-y: auto; }
.qi { display: grid; gap: 4px; text-align: left; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; border-left: 3px solid transparent; }
.qi:hover { background: #f6f9fd; }
.qi.on { background: var(--accent-soft); border-left-color: var(--accent); }
.qi b { font-weight: 600; font-size: 13.5px; }
.qi .m { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.qi.out { animation: slideout .35s ease forwards; }
@keyframes slideout { to { opacity: 0; transform: translateX(-30px); } }
.rec { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; }
.rec div { display: grid; gap: 1px; }
.rec span { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.cands { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.cand { text-align: left; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px; display: grid; gap: 8px; position: relative; }
.cand:hover { border-color: var(--accent-line); }
.cand.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.cand .score { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cand .meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.cand .meter i { display: block; height: 100%; border-radius: 3px; transition: width .7s ease; }
.cmp td.v { text-align: left; }
.sym { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-weight: 700; margin-right: 6px; font-size: 13px; }
.sym.y { background: var(--ok-bg); color: var(--ok); } .sym.p { background: var(--warn-bg); color: var(--warn); } .sym.n { background: var(--bad-bg); color: var(--bad); } .sym.m { background: var(--neu-bg); color: var(--neu); }
.reason { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; padding: 12px 14px; display: grid; gap: 8px; }
.reason h4 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.reason ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.preview { border: 1px solid var(--accent-line); border-radius: var(--r); padding: 14px 16px; background: #fbfdff; display: grid; gap: 10px; animation: fadein .25s ease; }
.preview ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 8px; font-weight: 500; }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner svg { width: 18px; height: 18px; flex: none; }
.try { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

function runCleanup(kind = 'historical') {

  const STAGES = [

    ['Checking NPIs', `${s.invalid + s.placeholder + s.group + s.deact + s.mismatch} NPI issues found`, 'Check digit, registry owner, organization NPI, active status'],

    ['Layer 2 · Iteration 2', `${it(2)} records linked · 3 new values learned`, 'Searching again with former names, new practices and phones'],

    ['Writing AI summaries', '24 doctor summaries', 'Generated from confirmed records only, with citations']

  const wasRan = S.ran; proc.running = true; proc.minimized = false;
  modal(`<div class="modal-h"><h2>${kind === 'historical' ? 'Running historical cleanup' : 'Processing upload'}</h2><span class="pill acc" id="pctPill">0%</span><button class="iconbtn x" id="minBtn" aria-label="Minimize">${ICON.min}</button></div>
    <div class="modal-b"><div class="pbar"><i id="pbar"></i></div>
    <div class="stages">${STAGES.map((st, i) => `<div class="stg" id="stg${i}"><div class="st"></div><div><b>${st[0]}</b><small>${st[2]}</small></div><div class="cnt" id="cnt${i}"></div></div>`).join('')}</div>
    <div class="log" id="log" aria-live="polite"></div></div>
    <div class="modal-f" id="procFoot"><button class="btn" id="skipBtn">Skip animation</button></div>`);
  $('#minBtn').onclick = () => { proc.minimized = true; $('#overlay').hidden = true; renderMini(); };
  let i = 0, li = 0, skip = false;
  $('#skipBtn').onclick = () => { skip = true; };
  const tick = () => {
    if (i > 0) { const p = $('#stg' + (i - 1)); p.className = 'stg done'; p.querySelector('.st').innerHTML = ICON.check; $('#cnt' + (i - 1)).textContent = STAGES[i - 1][1]; }
    if (i >= STAGES.length) return finish();
    $('#stg' + i).className = 'stg run';
    proc.pct = Math.round(i / STAGES.length * 100);
    $('#pbar').style.width = proc.pct + '%'; $('#pctPill').textContent = proc.pct + '%'; renderMini();
    const lg = $('#log'), n = new Date();
    if (LOGS[li]) { lg.insertAdjacentHTML('beforeend', `<div><span class="t">${n.toTimeString().slice(0, 8)}</span>${esc(LOGS[li++])}</div>`); lg.scrollTop = lg.scrollHeight; }
    i++; setTimeout(tick, skip || reduce ? 60 : 900);
  };
  const finish = () => {
    proc.running = false; proc.pct = 100; $('#pbar').style.width = '100%'; $('#pctPill').textContent = 'Done';
    const was = wasRan; S.ran = true; S.lastRun = 'Nov 11, 2026 · ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    const s2 = stats();

    $('#log').insertAdjacentHTML('beforeend', `<div><span class="t">done</span>${s2.total} records → ${s2.doctors} doctors</div>`);
    $('#procFoot').innerHTML = `<div class="result" style="flex:1">
      <button data-go="doctors"><b>${s2.doctors}</b><span>Golden doctors</span></button>
      <button data-list="all"><b>${s2.linked}</b><span>Records linked</span></button>
      <button data-go="review"><b>${s2.review + s2.compN}</b><span>Sent to people</span></button>
      <button data-list="unmatched"><b>${s2.unmatched}</b><span>Unmatched</span></button></div>

    $('#miniHost').innerHTML = '';
    if (proc.minimized) { $('#overlay').hidden = false; closeModal(); toast(`Cleanup finished · ${s2.total} records → ${s2.doctors} doctors <button class="link" data-go="doctors">View doctors</button>`); }
    route();
  };
  setTimeout(tick, 300);
}

function scoreText(txt) {

  return Object.keys(D).map(id => { const d = D[id]; let s = .15, why = [];
    const last = d.last.toLowerCase().split('-').concat(d.former ? [d.former.toLowerCase()] : []);
    if (toks.some(t => last.includes(t))) { s += .35; why.push(d.former && toks.includes(d.former.toLowerCase()) ? 'former surname' : 'surname'); }
    if (toks.includes(d.first.toLowerCase())) { s += .2; why.push('first name'); } else if (toks.some(t => t.replace('.', '') === d.first[0].toLowerCase())) { s += .08; why.push('first initial'); }
    if (toks.some(t => d.city.toLowerCase().split(' ').includes(t))) { s += .12; why.push('city'); }
    if (toks.includes('lci') && id === 'D001') { s += .12; why.push('practice (semantic: LCI ≈ Lakeshore)'); }
    if (toks.some(t => t.length > 3 && !['oncology', 'cancer', 'center', 'care', 'clinic', 'group', 'hematology'].includes(t) && d.org.toLowerCase().includes(t))) { s += .12; why.push('practice'); }
    return { id, s: Math.min(.97, s), why }; }).sort((a, b) => b.s - a.s).slice(0, 3);
}
